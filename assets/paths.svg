<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600"
     preserveAspectRatio="xMidYMid slice" fill="none">
  <title>Background paths</title>
  <style>
    path {
      stroke: #14110f;
      /* mostly drawn, small gap: the lines read as continuous contours with a
         slow travelling break, rather than short arcs chasing each other */
      stroke-dasharray: .82 .18;
      animation: flow var(--d) linear var(--t) infinite;
    }
    /* offset moves exactly one dash period per cycle, so the loop is seamless */
    @keyframes flow {
      0%   { stroke-dashoffset: 0;  opacity: .3 }
      50%  {                        opacity: .6 }
      100% { stroke-dashoffset: -1; opacity: .3 }
    }
    @media (prefers-reduced-motion: reduce) {
      path { animation: none; stroke-dasharray: none }
    }
  </style>
